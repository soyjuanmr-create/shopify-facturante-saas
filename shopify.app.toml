# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
client_id = "ddb03a81b1ffb2422828a5e3e5d8f177"
name = "facturante-conector"
application_url = "https://shopify-facturante-saas-production-d49a.up.railway.app"
embedded = true

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/shopify/order-paid"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/shopify/uninstall"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/shopify/gdpr"

[access_scopes]
scopes = "read_customers,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[access_scopes.protected_customer_data_access]
reason = "App needs customer name and email to generate legal electronic invoices (facturas electrónicas) as required by Argentina's tax authority (AFIP)."

[[access_scopes.protected_customer_data_access.fields]]
field = "name"
reason = "Required on the electronic invoice as the customer's legal name per AFIP regulations."

[[access_scopes.protected_customer_data_access.fields]]
field = "email"
reason = "Required to send the electronic invoice to the customer."

[auth]
redirect_urls = [ "https://shopify-facturante-saas-production-d49a.up.railway.app/api/auth/callback" ]

[app_preferences]
url = "https://shopify-facturante-saas-production-d49a.up.railway.app/admin"