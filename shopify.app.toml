# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2b4a5e3ce5dd4d99a19e30ec5c94803b"
name = "shopifac"
application_url = "https://shopifac-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks/shopify/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/shopify/order-paid"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/shopify/uninstall"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Para facturar ordenes de mas de 60 dias se necesita read_all_orders (scope protegido:
# requiere aprobacion de Shopify en el Partner Dashboard ANTES de activarlo). Una vez
# aprobado, reemplazar la linea scopes de abajo por:
# scopes = "read_customers,read_orders,write_orders,read_products,read_all_orders"
scopes = "read_customers,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[access_scopes.protected_customer_data_access]
reason = "App needs customer name and email to generate legal electronic invoices (facturas electrónicas) as required by Argentina's tax authority (AFIP)."

[[access_scopes.protected_customer_data_access.fields]]
field = "name"
reason = "Required on the electronic invoice as the customer's legal name per AFIP regulations."

[[access_scopes.protected_customer_data_access.fields]]
field = "email"
reason = "Required to send the electronic invoice to the customer."

[auth]
redirect_urls = [
  "https://shopifac-production.up.railway.app/api/auth/callback"
]

[app_preferences]
url = "https://shopifac-production.up.railway.app/admin"
